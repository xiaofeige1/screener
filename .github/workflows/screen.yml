name: okx62 Screener

on:
  schedule:
    - cron: "18 0,4,8,12 * * *"
  workflow_dispatch:

permissions:
  contents: write   # ✅ 关键

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true   # ✅ 保留 token

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: node okx2.js
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}

      - name: Commit result
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add result.json
          git commit -m "Update screener result" || echo "No changes"
          git push
